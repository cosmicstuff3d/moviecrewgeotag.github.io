<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Crew & Cast Origin Map</title>
  
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Theme Toggle Button (Desktop & Mobile) -->
  <button id="theme-toggle-btn" title="Toggle Light/Dark Mode">☀️ Light Mode</button>

  <div id="app-container">
    <aside id="credits-panel">
      <!-- Mobile Swipe/Drag Handle -->
      <div id="drawer-handle">
        <div class="handle-bar"></div>
        <span id="drawer-label">Swipe Up for Full List</span>
      </div>

      <header id="credits-header">
        <h1 id="movie-title">Loading Movie...</h1>
        <p class="subtitle">Crew & Cast Global Origins</p>
      </header>
      <div id="credits-list"></div>
    </aside>

    <main id="map-container">
      <div id="map"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
